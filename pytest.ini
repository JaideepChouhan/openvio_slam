[pytest]
# Pure-Python unit tests. Run with:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests/ -v
#
# Excluded:
#   test_protocol.py  — standalone HIL script: python3 tests/test_protocol.py /dev/ttyUSB0
#   (any launch_test_*.py should be run via the `launch_test` tool separately)
testpaths = tests
addopts = --ignore=tests/test_protocol.py
