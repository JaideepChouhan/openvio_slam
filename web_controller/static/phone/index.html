<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#060a12"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>OpenVIO · Camera Bridge</title>
  <style>
    :root {
      --bg0:      #060a12;
      --bg1:      #0c1220;
      --bg2:      #111d2e;
      --border:   #1a2d47;
      --border2:  #243d5c;
      --cyan:     #00d4ff;
      --cyan-dim: #0088aa;
      --green:    #00e5a0;
      --amber:    #f59e0b;
      --red:      #ef4444;
      --text:     #c8d8e8;
      --muted:    #4a6278;
      --mono:     'Courier New', 'Courier', monospace;
      --ui:       -apple-system, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg0);
      color: var(--text);
      font-family: var(--ui);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
    }
    .sys-ident {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .sys-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .sys-sub {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: .06em;
    }
    #clock {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .05em;
    }
    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .3s;
    }
    .pulse-dot.active {
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(0,229,160,.5);
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(0,229,160,.5); }
      70%  { box-shadow: 0 0 0 6px rgba(0,229,160,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,229,160,0); }
    }
    #status-rail {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .rail-cell {
      background: var(--bg1);
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rail-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .rail-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      transition: color .2s;
    }
    .rail-val.ok   { color: var(--green); }
    .rail-val.warn { color: var(--amber); }
    .rail-val.err  { color: var(--red); }
    .rail-unit {
      font-size: 9px;
      color: var(--muted);
      font-family: var(--mono);
    }
    #preview-wrap {
      flex-shrink: 0;
      position: relative;
      background: #000;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
    }
    #video {
      display: block;
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      mix-blend-mode: normal;
    }
    #canvas { display: none; }
    .hud-corner {
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--cyan);
      border-style: solid;
      opacity: .7;
    }
    .hud-corner.tl { top:6px; left:6px;  border-width: 1.5px 0 0 1.5px; }
    .hud-corner.tr { top:6px; right:6px; border-width: 1.5px 1.5px 0 0; }
    .hud-corner.bl { bottom:6px; left:6px;  border-width: 0 0 1.5px 1.5px; }
    .hud-corner.br { bottom:6px; right:6px; border-width: 0 1.5px 1.5px 0; }
    .cam-overlay {
      position: absolute;
      bottom: 6px; left: 8px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .cam-tag {
      font-family: var(--mono);
      font-size: 10px;
      background: rgba(6,10,18,.75);
      border: 1px solid var(--border2);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--cyan);
      letter-spacing: .06em;
    }
    #orientation-warn {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(6,10,18,.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    #orientation-warn.show { display: flex; }
    #orientation-warn .ow-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 8px var(--amber));
    }
    #orientation-warn .ow-text {
      font-size: 11px;
      color: var(--amber);
      text-align: center;
      max-width: 200px;
      line-height: 1.6;
      font-family: var(--mono);
    }
    #controls {
      flex-shrink: 0;
      padding: 10px 12px;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ctrl-label {
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      width: 90px;
      flex-shrink: 0;
    }
    .ctrl-input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .ctrl-input:focus { border-color: var(--cyan-dim); }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 5px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
      transition: opacity .15s, transform .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active  { transform: scale(.97); opacity: .85; }
    .btn:disabled{ opacity: .3; cursor: default; }
    .btn-primary {
      background: linear-gradient(135deg, #0066cc, #00aadd);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .btn-danger {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--red);
    }
    #log-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg0);
    }
    .log-head {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .log-head span {
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    #btn-clear-log {
      font-size: 9px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 0;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.8;
      -webkit-overflow-scrolling: touch;
    }
    .log-line { display: flex; gap: 8px; }
    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-msg  { color: var(--text); word-break: break-word; }
    .log-ok   .log-msg { color: var(--green); }
    .log-warn .log-msg { color: var(--amber); }
    .log-err  .log-msg { color: var(--red); }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <div id="topbar">
    <div class="pulse-dot" id="dot-live"></div>
    <div class="sys-ident">
      <div class="sys-name">OpenVIO Bridge</div>
      <div class="sys-sub">CAMERA ONLY · v5</div>
    </div>
    <span id="clock">--:--:--</span>
  </div>

  <!-- ── Status rail ─────────────────────────────────────────────────────── -->
  <div id="status-rail">
    <div class="rail-cell">
      <div class="rail-label">WebSocket</div>
      <div class="rail-val" id="ws-status">OFFLINE</div>
      <div class="rail-unit" id="ws-host">—</div>
    </div>
    <div class="rail-cell">
      <div class="rail-label">Camera</div>
      <div class="rail-val" id="cam-status">IDLE</div>
      <div class="rail-unit" id="cam-res">—</div>
    </div>
  </div>

  <!-- ── Camera preview ──────────────────────────────────────────────────── -->
  <div id="preview-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="cam-overlay">
      <div class="cam-tag" id="cam-fps-tag">0 fps</div>
      <div class="cam-tag" id="cam-size-tag">—</div>
    </div>
    <!-- Portrait mode warning -->
    <div id="orientation-warn">
      <div class="ow-icon">⟳</div>
      <div class="ow-text">ROTATE DEVICE TO LANDSCAPE<br>Portrait orientation increases latency.</div>
    </div>
  </div>

  <!-- ── Controls ────────────────────────────────────────────────────────── -->
  <div id="controls">
    <div class="ctrl-row">
      <div class="ctrl-label">Host IP</div>
      <input class="ctrl-input" type="text" id="ip" placeholder="192.168.x.x" autocomplete="off" autocorrect="off" spellcheck="false"/>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">Port</div>
      <input class="ctrl-input" type="number" id="port" value="9090"/>
      <div class="ctrl-label" style="width:auto;padding-left:8px">FPS</div>
      <select class="ctrl-input" id="fps-sel" style="max-width:90px">
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-connect">▶ CONNECT</button>
      <button class="btn btn-danger"  id="btn-stop" disabled>■ STOP</button>
    </div>
  </div>

  <!-- ── Log ─────────────────────────────────────────────────────────────── -->
  <div id="log-wrap">
    <div class="log-head">
      <span>System Log</span>
      <button id="btn-clear-log">Clear</button>
    </div>
    <div id="log"></div>
  </div>

</div><!-- #app -->

<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
// These must match what the launch file expects.
//   TOPIC_COMPRESSED  → consumed by image_transport/republish in the launch,
//                       decompressed onto /image for SLAM + web_controller.
//   FRAME_ID          → must equal the child frame of the TF
//                       base_link → camera_link in the launch file.
const TOPIC_COMPRESSED = '/camera/image_raw/compressed';
const MSG_TYPE         = 'sensor_msgs/CompressedImage';
const FRAME_ID         = 'camera_link';

const JPEG_QUALITY     = 0.82;
const MAX_LOG_LINES    = 120;
const STALL_MS         = 2000;   // no frame for this long → "STALL"

// ── State ───────────────────────────────────────────────────────────────────
let ros = null, imgTopic = null, camStream = null;
let frameTimer = null, fpsTimer = null, reconnectTimer = null;
let isLandscape = true;
let camFpsAccum = 0, camFpsDisplay = 0;
let lastPublishMs = 0;           // for stall detection

const $ = id => document.getElementById(id);
const video  = $('video');
const canvas = $('canvas');
const ctx2d  = canvas.getContext('2d', { willReadFrequently: false });

// ── Clock ───────────────────────────────────────────────────────────────────
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString();
}, 500);

// ── Logging ─────────────────────────────────────────────────────────────────
function log(msg, level = 'info') {
  const el = document.createElement('div');
  const t  = new Date().toLocaleTimeString('en-GB', { hour12: false });
  el.className = `log-line log-${level}`;
  el.innerHTML = `<span class="log-time">${t}</span><span class="log-msg">${msg}</span>`;
  const logEl = $('log');
  logEl.appendChild(el);
  while (logEl.children.length > MAX_LOG_LINES) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
$('btn-clear-log').addEventListener('click', () => { $('log').innerHTML = ''; });

// ── Status helpers ──────────────────────────────────────────────────────────
function setWsStatus(text, cls) {
  const el = $('ws-status');
  el.textContent = text;
  el.className = `rail-val ${cls}`;
}
function setCamStatus(text, cls) {
  const el = $('cam-status');
  el.textContent = text;
  el.className = `rail-val ${cls}`;
}

// ── Orientation ─────────────────────────────────────────────────────────────
function checkOrientation() {
  isLandscape = window.innerWidth >= window.innerHeight;
  const warn  = $('orientation-warn');
  warn.classList.toggle('show', !isLandscape);
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));
checkOrientation();

async function tryLockOrientation() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
      log('Screen locked to landscape', 'ok');
    }
  } catch (e) {
    log('Orientation lock not supported — rotate device manually', 'warn');
  }
}

// ── Camera ──────────────────────────────────────────────────────────────────
async function startCamera() {
  // Fallback for older browsers / non-HTTPS
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    if (navigator.getUserMedia) {
      return new Promise((resolve, reject) => {
        navigator.getUserMedia(
          { video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'environment' }, audio: false },
          (stream) => {
            camStream = stream;
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play().then(() => {
                canvas.width  = video.videoWidth;
                canvas.height = video.videoHeight;
                const dims = `${video.videoWidth}×${video.videoHeight}`;
                setCamStatus('LIVE', 'ok');
                $('cam-res').textContent     = dims;
                $('cam-size-tag').textContent = dims;
                log(`Camera: ${dims} (legacy API)`, 'ok');
                resolve(true);
              }).catch(reject);
            };
          },
          (err) => {
            log(`Camera error (legacy): ${err.message}`, 'err');
            setCamStatus('ERROR', 'err');
            reject(err);
          }
        );
      });
    } else {
      log('Camera: getUserMedia not available. Use Chrome/Firefox or enable HTTPS.', 'err');
      setCamStatus('UNSUPPORTED', 'err');
      $('cam-res').textContent = 'Unsupported';
      return false;
    }
  }

  // Modern API
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {
        width:       { ideal: 640, min: 320 },
        height:      { ideal: 480, min: 240 },
        aspectRatio: { ideal: 4 / 3 },
        facingMode:  { ideal: 'environment' },
      },
      audio: false,
    }).catch(() =>
      navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'environment' },
        audio: false,
      })
    );

    video.srcObject = camStream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    const dims = `${video.videoWidth}×${video.videoHeight}`;
    setCamStatus('LIVE', 'ok');
    $('cam-res').textContent      = dims;
    $('cam-size-tag').textContent = dims;
    log(`Camera: ${dims}`, 'ok');
    return true;
  } catch (e) {
    setCamStatus('ERROR', 'err');
    log(`Camera error: ${e.message}`, 'err');
    return false;
  }
}

// ── Frame capture ───────────────────────────────────────────────────────────
function startCameraLoop(fps) {
  const interval = Math.round(1000 / fps);

  frameTimer = setInterval(() => {
    if (!imgTopic || !isLandscape) return;

    // Backpressure: skip this frame if the WebSocket send buffer is backed up.
    // Without this, on slow Wi-Fi the JS heap grows and the tab eventually
    // gets killed by iOS/Android.
    const ws = ros && ros.socket;
    if (ws && ws.bufferedAmount > 64 * 1024) return;

    ctx2d.drawImage(video, 0, 0);

    const now  = Date.now();
    const sec  = Math.floor(now / 1000);
    const nsec = (now % 1000) * 1000000;
    const data = canvas.toDataURL('image/jpeg', JPEG_QUALITY).split(',')[1];

    imgTopic.publish({
      header: {
        stamp:    { sec, nanosec: nsec },
        frame_id: FRAME_ID,           // 'camera_link' — matches launch TF
      },
      format: 'jpeg',
      data,
    });

    camFpsAccum++;
    lastPublishMs = now;
  }, interval);

  // Once-per-second FPS readout + stall detection
  fpsTimer = setInterval(() => {
    camFpsDisplay = camFpsAccum;
    camFpsAccum   = 0;
    $('cam-fps-tag').textContent = `${camFpsDisplay} fps`;

    if (!imgTopic) return;   // not connected — leave status alone

    const sinceLast = Date.now() - lastPublishMs;
    if (camFpsDisplay > 0) {
      setCamStatus('LIVE', 'ok');
    } else if (sinceLast > STALL_MS) {
      setCamStatus('STALL', 'warn');
    }
  }, 1000);
}

// ── ROS connection ──────────────────────────────────────────────────────────
function connectROS(ip, port, fps) {
  if (ros) { try { ros.close(); } catch (_) {} }

  ros = new ROSLIB.Ros({ url: `ws://${ip}:${port}` });

  ros.on('connection', () => {
    setWsStatus('ONLINE', 'ok');
    $('ws-host').textContent = `${ip}:${port}`;
    $('dot-live').classList.add('active');
    log(`WebSocket connected → ${ip}:${port}`, 'ok');

    // No queue_size: this is a ROS 1 field and is ignored by rosbridge in
    // ROS 2. Left out intentionally.
    imgTopic = new ROSLIB.Topic({
      ros,
      name:        TOPIC_COMPRESSED,
      messageType: MSG_TYPE,
      latch:       false,
    });
    log(`Publishing → ${TOPIC_COMPRESSED}  (frame_id='${FRAME_ID}')`, 'ok');

    startCameraLoop(fps);

    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    _reconnectAttempts = 0;
  });

  ros.on('error', () => {
    setWsStatus('ERROR', 'err');
    log('WebSocket error — check host IP and rosbridge', 'err');
    scheduleReconnect(ip, port, fps);
  });

  ros.on('close', () => {
    setWsStatus('CLOSED', 'warn');
    $('dot-live').classList.remove('active');
    imgTopic = null;
    log('WebSocket closed', 'warn');
    scheduleReconnect(ip, port, fps);
  });

  setWsStatus('CONNECTING', 'warn');
}

let _reconnectAttempts = 0;
function scheduleReconnect(ip, port, fps) {
  if (!camStream) return;         // user stopped; don't auto-reconnect
  if (reconnectTimer) return;     // already queued
  _reconnectAttempts++;
  const delay = Math.min(2000 * _reconnectAttempts, 15000);
  log(`Reconnecting in ${delay / 1000}s (attempt ${_reconnectAttempts})…`, 'warn');
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectROS(ip, port, fps);
  }, delay);
}

// ── Stop ────────────────────────────────────────────────────────────────────
function stopAll() {
  if (frameTimer)     { clearInterval(frameTimer);    frameTimer = null; }
  if (fpsTimer)       { clearInterval(fpsTimer);      fpsTimer   = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (camStream)      { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if (ros)            { try { ros.close(); } catch (_) {} ros = null; }
  imgTopic = null;
  _reconnectAttempts = 0;
  lastPublishMs = 0;

  setWsStatus('OFFLINE', '');
  setCamStatus('IDLE', '');
  $('dot-live').classList.remove('active');
  $('cam-fps-tag').textContent  = '0 fps';
  $('cam-size-tag').textContent = '—';
  log('Session stopped.');
}

// ── Buttons ─────────────────────────────────────────────────────────────────
$('btn-connect').addEventListener('click', async () => {
  const ip   = $('ip').value.trim();
  const port = $('port').value.trim();
  const fps  = parseInt($('fps-sel').value) || 10;

  if (!ip) { log('Enter host IP address', 'err'); return; }

  $('btn-connect').disabled = true;
  $('btn-stop').disabled    = false;

  await tryLockOrientation();

  const camOk = await startCamera();
  if (!camOk) {
    $('btn-connect').disabled = false;
    $('btn-stop').disabled    = true;
    return;
  }

  connectROS(ip, port, fps);
});

$('btn-stop').addEventListener('click', () => {
  stopAll();
  $('btn-connect').disabled = false;
  $('btn-stop').disabled    = true;
  log('Session stopped by user.');
});

// ── Auto-fill IP from page host ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const host = window.location.hostname;
  if (host && host !== 'localhost' && host !== '127.0.0.1') {
    $('ip').value = host;
    log(`Auto-filled IP: ${host}`, 'ok');
  }
});

// ── Startup banner ──────────────────────────────────────────────────────────
log('OpenVIO Camera Bridge v5 loaded.', 'ok');
log(`Will publish → ${TOPIC_COMPRESSED}`, 'info');
log(`Frames will be stamped frame_id='${FRAME_ID}'`, 'info');
log('Phone streams video only — IMU comes from the robot.', 'info');
log('If camera fails, you need HTTPS or enable insecure origins in Chrome.', 'warn');
log('Note: phone and laptop clocks should be within ~50 ms for good SLAM.', 'info');
</script>
</body>
</html>
